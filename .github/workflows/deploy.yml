name: CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS via Native OpenSSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            set -e
            cd \"$WORK_DIR\"

            # Garante sincronia limpa com a main sem travar com conflitos locais
            git fetch origin main
            git reset --hard origin/main

            # Validação de segurança
            if [ ! -f .env ]; then
              echo '❌ ERRO: Arquivo .env não encontrado em $WORK_DIR.'
              exit 1
            fi

            # Build e orquestração Docker
            docker compose up --build -d

            # Migrations do Prisma
            docker compose exec -T api pnpm --filter @tailored-cv/api prisma:migrate:deploy

            # Limpeza de imagens órfãs
            docker image prune -f
          "
