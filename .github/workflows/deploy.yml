name: CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS via Native OpenSSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -p "$PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "
            set -e
            cd \"$WORK_DIR\"

            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo '❌ ERRO: Arquivo .env não encontrado em $WORK_DIR.'
              exit 1
            fi

            docker compose up --build -d
            docker compose exec -T api pnpm --filter @tailored-cv/api prisma:migrate:deploy
            docker image prune -f
          "
