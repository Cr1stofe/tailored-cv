name: CD Pipeline - Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS via Native OpenSSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "
            set -ex

            echo '==> [1/5] Entrando no diretório da aplicação:'
            cd \"$WORK_DIR\"
            pwd

            echo '==> [2/5] Sincronizando código com origin/main:'
            git fetch origin main
            git reset --hard origin/main

            echo '==> [3/5] Validando existência do arquivo .env:'
            if [ ! -f .env ]; then
              echo '❌ ERRO: Arquivo .env não encontrado em $WORK_DIR.'
              exit 1
            fi
            echo '✅ Arquivo .env verificado com sucesso.'

            echo '==> [4/5] Construindo e subindo containers com Docker Compose:'
            docker compose up --build -d

            echo '==> [5/5] Executando migrations do Prisma no container:'
            docker compose exec -T api pnpm --filter @tailored-cv/api prisma:migrate:deploy

            echo '==> Limpeza de imagens antigas do Docker:'
            docker image prune -f

            echo '🚀 Deploy concluído com sucesso!'
          "
