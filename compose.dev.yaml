services:
  postgres:
    image: postgres:17-alpine
    container_name: tailored-cv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tailored_cv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-tailored_cv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tailored_cv} -d ${POSTGRES_DB:-tailored_cv}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: tailored-cv-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tailored-cv-api
    restart: unless-stopped
    command: sh -c "pnpm --filter=@tailored-cv/api prisma:generate && pnpm --filter=@tailored-cv/api dev"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/data:/app/apps/api/data:ro
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-tailored_cv}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-tailored_cv}
      CORS_ORIGIN: http://localhost:3000,http://web:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PEPPER: ${PEPPER:?Defina PEPPER no .env}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
      INITIAL_USER_NAME: ${INITIAL_USER_NAME:-}
      INITIAL_USER_USERNAME: ${INITIAL_USER_USERNAME:-}
      RUN_MIGRATIONS: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web_gateway
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    image: tailored-cv-web:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tailored-cv-web
    restart: unless-stopped
    command: pnpm --filter=@tailored-cv/web dev
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      PORT: 3000
      INTERNAL_API_URL: http://tailored-cv-api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - web_gateway

volumes:
  postgres_data:

networks:
  default:
  web_gateway:
    external: false
