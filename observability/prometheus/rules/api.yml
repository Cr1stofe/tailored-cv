groups:
  - name: tailored-cv-api
    rules:
      - alert: TailoredCvApiHighErrorRate
        expr: |
          sum(rate(tailored_cv_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(tailored_cv_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Tailored CV API has a high server error rate
          description: More than 5% of API requests have returned 5xx responses over the last 10 minutes.

      - alert: TailoredCvAiProviderErrors
        expr: sum(rate(tailored_cv_ai_requests_total{status="error"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: AI provider requests are failing
          description: The AI provider has returned errors continuously for at least 5 minutes.

      - alert: TailoredCvAiLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(tailored_cv_ai_request_duration_seconds_bucket[10m]))) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AI request latency is high
          description: The p95 AI request duration is above 30 seconds.
